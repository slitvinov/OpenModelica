name: h60
on:
  workflow_dispatch:
  push:
    branches: [ci-h60]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/h60
      - name: h60
        working-directory: .github/h60
        run: |
          curl -sSfLo om.tgz https://build.openmodelica.org/omc/rust/latest/OpenModelica-CLI-latest-x86_64-linux.tar.gz
          mkdir om && tar -xzf om.tgz -C om
          export PATH=$PWD/om/bin:$PATH
          omc --version
          echo '$ omc s.mos'
          omc s.mos
          echo '$ ./def -lv=LOG_NLS | grep -E "errorCode|Solution status" | head -5'
          ./def -lv=LOG_NLS | grep -E "errorCode|Solution status" | head -5
