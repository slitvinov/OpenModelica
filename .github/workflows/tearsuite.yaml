name: tearsuite
on:
  workflow_dispatch:
  push:
    branches: [ci-tearsuite]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/tearsuite
      - name: tearsuite
        working-directory: .github/tearsuite
        run: |
          curl -sSfLo om.tgz https://build.openmodelica.org/omc/rust/latest/OpenModelica-CLI-latest-x86_64-linux.tar.gz
          mkdir om && tar -xzf om.tgz -C om
          ./om/bin/omc --version
          python3 ci.py om/bin/omc | tee -a "$GITHUB_STEP_SUMMARY"
