name: r13191
on:
  workflow_dispatch:
  push:
    branches: [ci-13191]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/r13191
      - name: r13191
        working-directory: .github/r13191
        run: |
          curl -sSfLo om.tgz https://build.openmodelica.org/omc/rust/latest/OpenModelica-CLI-latest-x86_64-linux.tar.gz
          mkdir om && tar -xzf om.tgz -C om
          ./om/bin/omc --version
          cat M.mo
          diff M.mo C.mo || true
          cat s.mos
          ./om/bin/omc s.mos 2>&1 | grep -v '^clang '
