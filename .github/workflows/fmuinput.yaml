name: fmuinput
on:
  workflow_dispatch:
  push:
    branches: [ci-fmuinput]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/fmuinput
      - name: fmuinput
        working-directory: .github/fmuinput
        run: |
          sudo apt-get install -y -qq valgrind >/dev/null
          curl -sSfLo om.tgz https://build.openmodelica.org/omc/rust/latest/OpenModelica-CLI-latest-x86_64-linux.tar.gz
          mkdir om && tar -xzf om.tgz -C om
          OMC=$(find "$PWD/om" -path '*/bin/omc' | head -1)
          $OMC --version
          $OMC b.mos
          cc -O2 -I"$(dirname "$(find "$PWD/om" -name fmi2Functions.h -path '*FMI2*' | head -1)")" run.c -o run -ldl
          for m in WithInput NoInput; do
            mkdir $m && (cd $m && unzip -q ../$m.fmu)
            guid=$(grep -o 'guid="[^"]*"' $m/modelDescription.xml | head -1 | cut -d'"' -f2)
            printf '%s: ' $m
            (cd $m && ../run "$PWD/binaries/linux64/$m.so" "$guid" "file://$PWD/resources" 100 0.01)
          done
          # instruction counts per function over 1000 fmi2DoStep calls
          cd WithInput
          valgrind --tool=callgrind --callgrind-out-file=cg.out ../run "$PWD/binaries/linux64/WithInput.so" "$(grep -o 'guid="[^"]*"' modelDescription.xml | head -1 | cut -d'"' -f2)" "file://$PWD/resources" 10 0.01 2>/dev/null
          callgrind_annotate cg.out 2>/dev/null | head -20
