name: obder
on:
  workflow_dispatch:
  push:
    branches: [ci-obder]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/fuzz/OBDER
      - name: repro
        working-directory: .github/fuzz/OBDER
        run: |
          curl -sSfLo om.tgz https://build.openmodelica.org/omc/rust/latest/OpenModelica-CLI-latest-x86_64-linux.tar.gz
          mkdir om && tar -xzf om.tgz -C om
          ./om/bin/omc --version
          echo '$ cat D.mo'; cat D.mo; echo '$ cat s.mos'; cat s.mos; echo '$ omc s.mos'
          ./om/bin/omc s.mos 2>&1 | grep -v '^clang '
